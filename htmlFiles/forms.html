<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegistrationForm</title>
</head>
<body>
    
<div style="text-align: center;">
    <h1>Employe Registration</h1>
<form >
    <label for="username">user name</label>
     <input type="text" name="username" id="username" placeholder="xyz karn">

     <br></br>

     <label for="email">email</label>
     <input type="email" name="email" id="email" placeholder="eg.xyz@gmail.com">

     <br></br>

     <label for="role">Role</label>
     <input type="text" name="role" id="role" placeholder="eg.user">

     <br></br>

     <label for="password">Password</label>
     <input type="password" name="password" id="password"placeholder="eg.A12dm3o">

     <br></br>

     <!--radio button-->
     
     <label for="male">male</label>
     <input type="radio" name="gender" id="male" value="male">
     <label for="female">female</label>
     <input type="radio" name="gender" id="female" value="female">
     <label for="others">others</label>
     <input type="radio" name="gender" id="others" value="others">
    <br></br>
     <!--checkbox-->
      
     <label for="backend">Backend</label>
    <input type="checkbox" name="intrested_profiles" id="backend" value="backend">
     <br></br>

    <label for="frontend">frontend</label>
    <input type="checkbox" name="intrested_profiles" id="frontend" value="frontend">
     <br></br>

    <label for="devops">devops</label>
    <input type="checkbox" name="intrested_profiles" id="devops" value="devops">
    <br></br>

    <label for="database">database</label>
    <input type="checkbox" name="intrested_profiles" id="database" value="database">
    <br></br>

    <label for="Ai">Ai</label>
    <input type="checkbox" name="intrested_profiles" id="Ai" value="Ai">
    <br></br>

     <label for="joining date">joining date</label>
     <input type="date" name="joining date" id="joining date">
     <br></br>

     <!--file upload-->
     <label for="resume">resume</label>
     <input type="file" name="resume" id="resume">
     <br></br>

     <!--Large text input-->
     
     <label for="address">address</label>
     <br></br>
     <textarea name="address" id="address" rows="10" cols="30"></textarea>
     <br></br>

<!--Selection corner-->

<label for="course">select course</label>
<br></br>
  <select name="course" id="course">
    <option name="cse" value="cse">cse</option>
    <option name="cse" value="cse">ai/ml</option>
    <option name="cse" value="cse">ece</option>
    <option name="cse" value="cse">ee</option>
  </select>


     <br></br>
     <input type="submit">

</form>
</div>

</body>
</html>
